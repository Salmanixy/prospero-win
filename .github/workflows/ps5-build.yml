name: Build PS5 App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            clang-18 \
            llvm-18 \
            llvm-18-tools \
            lld \
            lld-18 \
            python3 \
            python3-pip \
            git \
            wget \
            curl \
            pkg-config \
            gcc-multilib \
            g++-multilib \
            zip \
            unzip \
            make \
            file \
            binutils

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user pyyaml

      - name: Check setup
        run: |
          python3 tools/check_setup.py

      - name: Build PS5 native application
        run: |
          chmod +x tools/build_native.sh
          tools/build_native.sh

      - name: Build Wine PS5 modules
        run: |
          chmod +x tools/build_wine_ps5.sh
          tools/build_wine_ps5.sh

      - name: Show output
        if: always()
        run: |
          echo "===== DIST ====="
          find dist -maxdepth 5 -type f -print 2>/dev/null || true

          echo "===== BUILD ====="
          find build -maxdepth 5 -type f -print 2>/dev/null | head -500

      - name: Package PS5 build
        run: |
          mkdir -p artifacts
          if [ -d dist ]; then
            cp -a dist/. artifacts/
          fi
          if [ -d build ]; then
            cp -a build artifacts/build
          fi

          cd artifacts
          zip -r ../prospero-win-ps5.zip .

      - name: Upload PS5 build
        uses: actions/upload-artifact@v4
        with:
          name: prospero-win-ps5
          path: prospero-win-ps5.zip
          if-no-files-found: error
